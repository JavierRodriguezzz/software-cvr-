services:
  secretaria-salud-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secretaria-salud-front
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ENV: production
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - uploads_data:/app/uploads
      - previews_data:/app/previews
      - output_processed_data:/app/output_processed
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  uploads_data:
  previews_data:
  output_processed_data:
