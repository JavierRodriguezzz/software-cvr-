<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso — DataCluster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FFFFFF;
      --surface:   #F8F9FA;
      --border:    #E2E8F0;
      --accent:    #00B4D8;
      --accent-dim:#00B4D822;
      --secondary: #7209B7;
      --text:      #0F172A;
      --muted:     #64748B;
      --error:     #DC2626;
      --success:   #00B4D8;
    }

    body.dark {
      --bg:        #121824;
      --surface:   #1A2332;
      --border:    #2A3344;
      --accent:    #00B4D8;
      --accent-dim:#00B4D822;
      --secondary: #7209B7;
      --text:      #E2E8F0;
      --muted:     #8899B0;
      --error:     #EF4444;
      --success:   #00B4D8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: background 0.3s, color 0.3s;
    }

    canvas#grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.25;
    }

    body.dark canvas#grid { opacity: 0.15; }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2.25rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 0 1px #00000008, 0 24px 48px #00000010;
      transition: background 0.3s, border-color 0.3s;
    }

    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.6rem 0;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
      padding: 0.65rem 0.85rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.3s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .error-banner {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #DC262612;
      border: 1px solid #DC262630;
      border-radius: 7px;
      padding: 0.6rem 0.85rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: var(--error);
    }

    .error-banner svg { flex-shrink: 0; }

    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 7px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.72rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    button[type="submit"]:hover  { opacity: 0.88; }
    button[type="submit"]:active { transform: scale(0.98); }

    .card-footer {
      margin-top: 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .version-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: var(--border);
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .status-dot span {
      width: 6px; height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--success);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .theme-toggle {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.1rem;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
      box-shadow: 0 2px 8px #00000012;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 420px) {
      .card { margin: 1rem; padding: 2rem 1.5rem 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      canvas#grid { display: none; }
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<canvas id="grid"></canvas>

<div class="card">
  <p class="logo">DataCluster / Auth</p>
  <h1>Iniciar sesión</h1>
  <p class="subtitle">Accede al panel de análisis de clustering y visualizaciones.</p>

  <div class="divider"></div>

  {% if error %}
  <div class="error-banner">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="7.25" stroke="#DC2626" stroke-width="1.5"/>
      <path d="M8 4.5V8.5" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="11" r="0.75" fill="#DC2626"/>
    </svg>
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username"
             placeholder="tu_usuario" autocomplete="username" autofocus />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password"
             placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button type="submit">Acceder →</button>
  </form>

  <div class="card-footer">
    <span class="version-tag">v0.1.0-dev</span>
    <div class="status-dot"><span></span> Servicio activo</div>
  </div>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="Alternar modo oscuro">🌙</button>

<script>
  const canvas = document.getElementById('grid');
  const ctx    = canvas.getContext('2d');
  let W, H, dots = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildDots();
  }

  function buildDots() {
    dots = [];
    const cols = Math.ceil(W / 32);
    const rows = Math.ceil(H / 32);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() > 0.45) continue;
        dots.push({
          x:    c * 32 + 16,
          y:    r * 32 + 16,
          r:    Math.random() * 1.2 + 0.4,
          base: Math.random() * Math.PI * 2,
          spd:  0.004 + Math.random() * 0.006,
        });
      }
    }
  }

  let tick = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    tick += 1;
    for (const d of dots) {
      const alpha = 0.25 + 0.2 * Math.sin(d.base + tick * d.spd);
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,180,216,${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();

  const toggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.body.classList.add('dark');
    toggle.textContent = '☀️';
  }
  toggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    toggle.textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });
</script>

</body>
</html>
